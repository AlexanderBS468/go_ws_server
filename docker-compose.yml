services:
  app:
    build:
      context: .
    environment:
      SERVER_PORT: "8080"
      REDIS_ADDR: redis:6379
      WS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8080:8080"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
